<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GridClaim</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">

  <!-- Tailwind Play CDN (no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Custom animations & cell sizing via Tailwind's CSS layer -->
  <style type="text/tailwindcss">
    @keyframes claim-pulse {
      0%   { transform: scale(1);    opacity: 1; }
      40%  { transform: scale(1.25); opacity: 0.75; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .cell-pulse {
      animation: claim-pulse 0.45s ease-out;
      z-index: 10;
      position: relative;
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div id="root"></div>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel (transpiles JSX in-browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Socket.io client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!--
    Load order matters: Cell sets window.Cell, UI sets window.UI, App uses both.
  -->
  <script type="text/babel" src="./components/Cell.jsx"></script>
  <script type="text/babel" src="./components/UI.jsx"></script>
  <script type="text/babel" src="./App.jsx"></script>
</body>
</html>
